# Render blueprint: New > Blueprint > pick this repo. Render asks for the two keys when it
# creates the service; they live in Render's settings, not in the repo.
services:
  - type: web
    name: amma-ji
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TTS_VOICE
        value: Chetana
